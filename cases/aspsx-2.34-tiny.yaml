---
id: aspsx-2.34-tiny

fixture: aspsx-2.34

labels:
  - aspsx
  - aspsx-2.34
  - assembler

command:
  program: ASPSX.EXE
  args:
    - -o
    - FOO.O
    - MIPS.S

inputs:
  # Tracked source is tiny/mips.s (identical to daze's MIPS.S test input).
  # Materialize with DOS line endings.
  - source: sources/tiny/mips.s
    dest: MIPS.S
    crlf: true

outputs:
  - path: FOO.O

benchmark:
  size: tiny
  iterations: 20
