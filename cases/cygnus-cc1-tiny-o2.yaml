---
id: cygnus-cc1-tiny-o2

fixture: cygnus-2.7-96Q3

labels:
  - cygnus
  - cygnus-2.7-96Q3
  - cc1
  - o2

command:
  program: CC1.EXE
  args:
    - -O2
    - -o
    - foo.s
    - foo.i

inputs:
  # Same frozen seed as the -O0 sibling; only the flag varies, so any
  # -O0/-O2 output difference is pure optimizer behavior.
  - source: sources/tiny/simple.i
    dest: foo.i

outputs:
  - path: foo.s

benchmark:
  size: tiny
  iterations: 5
