---
id: aspsx-1.05-tiny

fixture: aspsx-1.05

labels:
  - aspsx
  - aspsx-1.05
  - assembler

command:
  program: ASPSX.EXE
  args:
    - -o
    - FOO.O
    - MIPS.S

inputs:
  # Tracked source is tiny/mips.s (identical to daze's MIPS.S test input).
  # Materialize with DOS line endings: ASPSX 1.05 rejects bare LF.
  - source: sources/tiny/mips.s
    dest: MIPS.S
    crlf: true

outputs:
  - path: FOO.O

benchmark:
  size: tiny
  iterations: 20
