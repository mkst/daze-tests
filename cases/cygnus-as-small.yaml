---
id: cygnus-as-small

fixture: cygnus-2.7-96Q3

labels:
  - cygnus
  - cygnus-2.7-96Q3
  - as

command:
  program: AS.EXE
  args:
    - -o
    - foo.o
    - foo.s

inputs:
  # Seeded from the verified cygnus-cc1-small output, frozen.
  - source: sources/small/sieve.s
    dest: foo.s

outputs:
  # COFF bytes 4-7 are an object-finalize timestamp sampled from the DOS
  # clock (host wall clock via INT 21h date/time). Fast inputs agree
  # across backends within a run, but the stamp moves with the calendar,
  # so an exact hash goes stale overnight (observed: blessed Oct 6,
  # failing Oct 7 with both backends agreeing on the new bytes). Mask
  # those bytes like the large/xlarge cases; everything else compares
  # exactly.
  - path: foo.o
    mask: [[4, 8]]

benchmark:
  size: small
  iterations: 10
